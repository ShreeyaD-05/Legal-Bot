# ═══════════════════════════════════════════════════════════════
#  LegalBot — Docker Compose (Local Multi-Container Orchestration)
#
#  Services:
#    fastapi   — REST API backend  → http://localhost:8000
#    streamlit — Web UI frontend   → http://localhost:8501
#
#  Usage:
#    docker compose up --build          # build images and start
#    docker compose up -d               # start in background
#    docker compose logs -f             # stream logs
#    docker compose down                # stop and remove containers
#    docker compose down -v             # also remove volumes
# ═══════════════════════════════════════════════════════════════

name: legalbot

# ─────────────────────────────────────────────────────────────
#  Shared environment variables
#  Values here are defaults — override by creating a .env file
#  in the same directory as this compose file.
# ─────────────────────────────────────────────────────────────
x-common-env: &common-env
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  GROQ_API_KEY: ${GROQ_API_KEY}          # loaded from .env file
  REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60}

services:

  # ───────────────────────────────────────────────────────────
  #  Service 1 — FastAPI Backend
  # ───────────────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime          # use the lean runtime stage
    image: legalbot-fastapi:latest
    container_name: legalbot-fastapi

    # Environment — common vars + API-specific settings
    environment:
      <<: *common-env
      HOST: 0.0.0.0
      PORT: 8000

    # Load secrets from .env file (not baked into image)
    env_file:
      - .env

    # Port mapping: host:container
    ports:
      - "8000:8000"

    # Volume mounts for live development
    # app/ code changes are reflected without rebuilding
    volumes:
      - ./app:/app/app:ro         # mount app source read-only
      - legalbot-logs:/app/logs   # persist logs across restarts

    # Resource limits — prevents runaway container consumption
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # Restart policy
    restart: unless-stopped

    # Healthcheck — identical to Dockerfile HEALTHCHECK
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    # Override the Dockerfile CMD to use uvicorn with reload for dev
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload                  # auto-reload on code changes
      - --log-level
      - info

    networks:
      - legalbot-net

  # ───────────────────────────────────────────────────────────
  #  Service 2 — Streamlit Frontend
  # ───────────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: legalbot-streamlit:latest
    container_name: legalbot-streamlit

    environment:
      <<: *common-env
      # Tell Streamlit which FastAPI URL to point to
      FASTAPI_URL: http://fastapi:8000

    env_file:
      - .env

    ports:
      - "8501:8501"

    volumes:
      - ./app:/app/app:ro
      - ./streamlit_app.py:/app/streamlit_app.py:ro

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    restart: unless-stopped

    # Streamlit healthcheck — polls the Streamlit health endpoint
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    # Override Dockerfile CMD to run Streamlit instead of uvicorn
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true       # no browser auto-open in container
      - --browser.gatherUsageStats=false

    # Streamlit starts after FastAPI is healthy
    depends_on:
      fastapi:
        condition: service_healthy

    networks:
      - legalbot-net


# ─────────────────────────────────────────────────────────────
#  Named volumes
# ─────────────────────────────────────────────────────────────
volumes:
  legalbot-logs:
    driver: local


# ─────────────────────────────────────────────────────────────
#  Networks — isolated bridge network for inter-service comms
# ─────────────────────────────────────────────────────────────
networks:
  legalbot-net:
    driver: bridge
